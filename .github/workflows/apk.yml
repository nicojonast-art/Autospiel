name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Signaturschluessel: wird einmal erzeugt und privat im Cache gehalten,
      # damit neue Versionen ueber die alte installiert werden koennen.
      - name: Signaturschluessel laden
        id: key
        uses: actions/cache@v4
        with:
          path: android/app/autospiel.keystore
          key: autospiel-signing-v1

      - name: Signaturschluessel erzeugen (nur beim ersten Mal)
        if: steps.key.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore android/app/autospiel.keystore
          -storepass autospiel -keypass autospiel -alias autospiel
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Autospiel, O=nicojonast-art, C=DE" -storetype JKS

      - name: Bot-Code in die App kopieren
        run: cp *.py android/app/src/main/python/

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: APK bereitstellen
        run: cp android/app/build/outputs/apk/release/app-release.apk Autospiel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Autospiel-apk
          path: Autospiel.apk

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Autospiel v1.${{ github.run_number }}
          make_latest: true
          files: Autospiel.apk
          body: |
            **Autospiel** – spielt Yarn Loop und Car Match automatisch.

            Installieren: auf dem Handy `Autospiel.apk` unten antippen → herunterladen → öffnen → installieren
            (beim ersten Mal „Unbekannte Apps installieren“ für den Browser erlauben).
